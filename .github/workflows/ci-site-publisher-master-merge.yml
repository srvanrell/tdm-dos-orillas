name: mkdocs-ci-site-publisher-on-merge
on:
  push:
    branches:
      - master
permissions:
  contents: read
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv and enable cache
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install the project
        run: uv sync --locked --all-extras --dev
      # - run: pip install git+https://github.com/srvanrell/ranking-table-tennis.git@branch-name
      - id: rtt-preprocess
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: uv run rtt preprocess --assume-yes
      - if: ${{ steps.rtt-preprocess.outputs.stop_workflow != 'true' }}
        run: uv run rtt compute
      - if: ${{ steps.rtt-preprocess.outputs.stop_workflow != 'true' }}
        run: uv run rtt publish --last
      - if: ${{ steps.rtt-preprocess.outputs.stop_workflow != 'true' }}
        run: uv run ./update_results_to_publish.sh
      - if: ${{ steps.rtt-preprocess.outputs.stop_workflow != 'true' }}
        run: uv run zensical build --clean
      - if: ${{ steps.rtt-preprocess.outputs.stop_workflow != 'true' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - if: ${{ steps.rtt-preprocess.outputs.stop_workflow != 'true' }}
        uses: actions/deploy-pages@v5
        id: deployment
