name: mkdocs-ci-site-publisher-cron
on:
  workflow_dispatch:
  # schedule:
  #  - cron: '0 5 * * *'  # Runs at night (05:00 UTC) every Day
permissions:
  contents: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 123456+github-actions[bot]@users.noreply.github.com
      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv and enable cache
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install the project
        run: uv sync --all-extras
      # - run: uv pip install git+https://github.com/srvanrell/ranking-table-tennis.git@branch-name
      # Combines preprocess, compute and publish to automatically resolve
      - id: rtt-automatic
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: uv run rtt automatic
      - if: ${{ steps.rtt-automatic.outputs.stop_workflow != 'true' }}
        run: uv run ./update_results_to_publish.sh
      - if: ${{ steps.rtt-automatic.outputs.stop_workflow != 'true' }}
        uses: EndBug/add-and-commit@v9
        with:
          message: Committed from cron workflow
          committer_name: GitHub Actions
          committer_email: actions@github.com
      - if: ${{ steps.rtt-automatic.outputs.stop_workflow != 'true' }}
        run: zensical build --clean  
      - if: ${{ steps.rtt-automatic.outputs.stop_workflow != 'true' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - if: ${{ steps.rtt-automatic.outputs.stop_workflow != 'true' }}
        uses: actions/deploy-pages@v5
        id: deployment
